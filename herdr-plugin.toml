# herdr-agent-hub as a Herdr plugin: Herdr runs a one-shot `herdr-agent-hub tick` whenever something can
# move a conversation forward, so nothing has to stay running.
id = "herdr-agent-hub"
name = "herdr-agent-hub"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Chat rooms for coding agents, one per workspace"
platforms = ["linux", "macos"]

# Run by `herdr plugin install` (not by `plugin link`; build a linked checkout yourself).
[[build]]
command = ["bun", "install", "--frozen-lockfile"]

[[build]]
command = ["bun", "run", "build"]

# Herdr started (or a new server took over): continue every room.
[[startup]]
command = ["dist/herdr-agent-hub", "tick"]

# An agent went idle (deliver to it; an agent that just posted ended its turn), started working,
# or got stuck on a question.
[[events]]
on = "pane.agent_status_changed"
command = ["dist/herdr-agent-hub", "tick"]

# Agents are recognized again after Herdr restarts.
[[events]]
on = "pane.agent_detected"
command = ["dist/herdr-agent-hub", "tick"]

# A member's pane went away: tell the room.
[[events]]
on = "pane.closed"
command = ["dist/herdr-agent-hub", "tick"]

[[events]]
on = "pane.exited"
command = ["dist/herdr-agent-hub", "tick"]
