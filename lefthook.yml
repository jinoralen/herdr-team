# Git hooks, installed by `bun install` (the prepare script). Skip once with `git commit --no-verify`.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,json}"
      run: bun x biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: types
      run: bun check
    - name: knip
      run: bun x knip
    - name: tests
      run: bun test
