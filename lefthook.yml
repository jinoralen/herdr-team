# Git hooks, installed by `bun install` (the prepare script). Skip once with `--no-verify`.
# Pre-commit runs the fast checks (about a second); the slow test suite waits for pre-push.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,json}"
      run: bun x biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: types
      run: bun check
    - name: knip
      run: bun x knip

pre-push:
  jobs:
    - name: tests
      run: bun test --parallel
