name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      - run: ./dist/herdr-agent-hub --help
      - run: ./dist/herdr-compose --help
      - run: HERDR_TEST_BIN_DIR="$PWD/dist" bun test ./tests/cli ./tests/compose
